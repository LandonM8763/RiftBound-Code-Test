name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Typechecks the packages and, separately, the test files.
      - run: npm run typecheck
      # Includes the random-agent fuzz run: a crash, an illegal state, or a
      # non-terminating game fails the build.
      - run: npm test
